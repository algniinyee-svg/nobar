<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nobar">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Nobar</title>
<style>
:root{--ink:#f4f7ff;--mute:#b4bedb;--glass:rgba(255,255,255,.12);--edge:rgba(255,255,255,.28);--acc:#7fd6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:#0b1020;overflow:hidden;overscroll-behavior:none;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(45% 35% at 12% 8%,#4f6bff,transparent 70%),radial-gradient(40% 35% at 95% 28%,#00d4b4cc,transparent 70%),radial-gradient(55% 45% at 30% 100%,#c13bffcc,transparent 70%),radial-gradient(35% 30% at 80% 75%,#ff7a59aa,transparent 70%),#0b1020}
.bg::before,.bg::after{content:"";position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:.45;animation:dr 18s ease-in-out infinite alternate}
.bg::before{left:-30vmax;top:-20vmax;background:radial-gradient(closest-side,#5b7bff,transparent)}
.bg::after{right:-35vmax;bottom:-25vmax;background:radial-gradient(closest-side,#c13bff,transparent);animation-delay:-9s}
@keyframes dr{to{transform:translate(12vmax,10vmax)}}
@keyframes bob{50%{transform:translateY(-8px)}}
html,body,#join,#room{height:100dvh}
.glass{border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.07) 55%,rgba(255,255,255,.14));-webkit-backdrop-filter:blur(34px) saturate(1.9) brightness(1.1);backdrop-filter:blur(34px) saturate(1.9) brightness(1.1);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.14),inset 0 0 28px rgba(255,255,255,.07),0 14px 44px rgba(0,0,0,.32)}
input,button{font:inherit;color:var(--ink);border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.14);padding:12px 16px;outline:none;-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
input{font-size:16px;-webkit-appearance:none;appearance:none}
input::placeholder{color:var(--mute)} input:focus,button:focus-visible{border-color:var(--acc)}
button{cursor:pointer;font-weight:600;font-size:15px} button:active{transform:scale(.97)} button:disabled{opacity:.4}
.pri{background:linear-gradient(135deg,rgba(127,214,255,.45),rgba(157,140,255,.45))}
.lnk{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--acc);padding:4px 8px;font-size:14px}
#hi{margin:0;color:var(--mute);text-align:left}#hi b{color:var(--ink)}
#join{display:flex;flex-direction:column;align-items:center;padding:20px;text-align:center}
.hero{flex:1;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{width:92px;height:92px;display:grid;place-items:center;margin-bottom:12px;animation:bob 5s ease-in-out infinite}
.logo svg{width:50px;height:50px}
h1{font-size:46px;font-weight:800;letter-spacing:-1.5px;margin:0;background:linear-gradient(135deg,#fff,#9be7ff 45%,#c9a8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.sub{color:var(--mute);margin:6px 0 0}
.card{width:100%;padding:20px;gap:12px;margin-top:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chips span{font-size:12px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:var(--mute)}
#ioshint{display:none;font-size:12px;color:var(--mute);margin:12px 0 0}
footer{padding:10px 0 6px;font-size:12px;color:var(--mute);letter-spacing:.3px}footer b{color:var(--ink)}
#room{display:none;flex-direction:column;gap:10px;padding:10px;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px}
.tl{display:flex;align-items:center;gap:10px;min-width:0}.tl>div{line-height:1.25;min-width:0}.tl .badge{display:block}
#leave{padding:7px 12px;font-size:13px}
.top b{letter-spacing:2px}.badge{font-size:12px;color:var(--mute)}
#stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:28px;overflow:hidden;border:1px solid var(--edge);box-shadow:0 14px 44px rgba(0,0,0,.4)}
#stage>*{position:absolute;inset:0;width:100%;height:100%;border:0}
#empty{display:flex;align-items:center;justify-content:center;color:var(--mute);text-align:center;padding:16px}
.ctl{display:flex;gap:8px;align-items:center;padding:8px 10px}
.ctl input[type=range]{flex:1;padding:0;height:28px;accent-color:var(--acc);background:none;border:0;box-shadow:none}
.row{display:flex;gap:8px;padding:0 2px}.row input{flex:1;min-width:0}
#prop{display:none;padding:10px 14px;align-items:center;gap:8px;justify-content:space-between}
#chat{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.m{max-width:85%;padding:7px 12px;border-radius:18px;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);word-break:break-word}
.m small{display:block;color:var(--mute);font-size:11px}.m.me{align-self:flex-end;background:rgba(127,214,255,.3)}
.m.sys{align-self:center;background:none;box-shadow:none;color:var(--mute);font-size:12px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:rgba(20,26,48,.95);border:1px solid var(--edge);padding:8px 16px;border-radius:999px;display:none;z-index:99;max-width:90vw;text-align:center}
#stage>#unm{display:none;z-index:5;width:auto;height:auto;inset:auto auto 10px 50%;transform:translateX(-50%);background:rgba(20,26,48,.9);padding:8px 14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div class="bg"></div><div id="toast"></div>
<div id="join"><div class="hero">
<div class="logo glass"><svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9be7ff"/><stop offset="1" stop-color="#b79bff"/></linearGradient></defs><circle cx="32" cy="32" r="29" fill="none" stroke="url(#lg)" stroke-width="3"/><path d="M26 19l21 13-21 13z" fill="url(#lg)"/></svg></div>
<h1>Nobar</h1><p class="sub">Nonton bareng, ngobrol bareng.<br>Satu room untuk 8 orang.</p>
<div class="glass card" id="acard" style="display:none">
<input id="au" placeholder="Username" maxlength="16" autocomplete="username" autocapitalize="none" autocorrect="off">
<input id="ap" type="password" placeholder="Password" maxlength="64" autocomplete="current-password">
<button class="pri" id="ab">Masuk</button><button class="lnk" id="at">Belum punya akun? Daftar</button></div>
<div class="glass card" id="jcard" style="display:none">
<p id="hi">Halo, <b id="un"></b> · <button class="lnk" id="lo">Ganti akun</button></p>
<input id="name" placeholder="Nama kamu" maxlength="16" autocomplete="off">
<input id="code" placeholder="Kode room" maxlength="12" autocapitalize="characters" autocomplete="off">
<button class="pri" id="go">Masuk room</button></div>
<div class="chips"><span>▶ Sinkron</span><span>💬 Chat</span><span>🎤 Voice</span><span>📷 Video</span></div>
<p id="ioshint">Di iPhone: ketuk tombol Bagikan lalu pilih “Tambah ke Layar Utama”.</p>
</div><footer>Dibuat oleh <b>Algani Hamid</b></footer></div>
<div id="room">
<div class="glass top"><div class="tl"><button id="leave">Keluar</button><div><b id="rc"></b><span class="badge" id="info"></span></div></div><button id="share" style="padding:6px 12px">Salin link</button></div>
<div id="stage"><div id="empty">Belum ada video. Tempel link YouTube atau video langsung (.mp4) di bawah.</div></div>
<div class="glass ctl"><button id="pp" style="width:46px;padding:10px 0">▶</button><input type="range" id="seek" min="0" max="1000" value="0"><span class="badge" id="tm">0:00</span></div>
<div class="row"><input id="url" placeholder="Link YouTube / .mp4" autocomplete="off"><button id="load" class="pri">Putar</button></div>
<div class="glass" id="prop"><span id="pt"></span><span><button id="no" style="padding:8px 12px">Tolak</button> <button id="yes" class="pri" style="padding:8px 12px">Setuju</button></span></div>
<div class="glass" id="chat"><div id="msgs"></div><div class="row"><input id="msg" placeholder="Ketik pesan…" maxlength="300" autocomplete="off"><button id="snd">Kirim</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let ws,me=0,host=0,mode='solo',code='',name='',vid=null,playing=false,yt=null,el=null,retry=0,dragging=false,sync=null,leaving=false,lt=0,loadingHist=false;
let TOKEN='',USER='',ACC=false,reg=false;
try{TOKEN=localStorage.getItem('nobar-token')||''}catch(e){}
const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2800)};
const fmt=s=>{s=Math.max(0,s|0);return(s/60|0)+':'+String(s%60).padStart(2,'0')};
const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(ios&&!navigator.standalone)$('ioshint').style.display='block';
const hash=location.hash.slice(1);if(hash)$('code').value=decodeURIComponent(hash).toUpperCase();
try{$('name').value=localStorage.getItem('nobar-name')||''}catch(e){}
function show(){$('acard').style.display=ACC&&!USER?'grid':'none';$('jcard').style.display=!ACC||USER?'grid':'none';
 $('hi').style.display=ACC?'block':'none';$('un').textContent=USER;$('name').style.display=ACC?'none':'block'}
(async()=>{try{const r=await fetch('/api/me',{headers:{Authorization:'Bearer '+TOKEN}});const j=await r.json();ACC=!!j.accounts;USER=j.user||''}catch(e){}show()})();
$('at').onclick=()=>{reg=!reg;$('ab').textContent=reg?'Daftar':'Masuk';$('at').textContent=reg?'Sudah punya akun? Masuk':'Belum punya akun? Daftar';$('ap').autocomplete=reg?'new-password':'current-password'};
$('ab').onclick=async()=>{const u=$('au').value.trim(),p=$('ap').value;if(!u||!p)return toast('Isi username dan password');
 $('ab').disabled=true;
 try{const r=await fetch(reg?'/api/register':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
  const j=await r.json();if(!r.ok)return toast(j.error||'Gagal');
  TOKEN=j.token;USER=j.user;try{localStorage.setItem('nobar-token',TOKEN)}catch(e){}$('ap').value='';show()}
 catch(e){toast('Tidak bisa terhubung ke server')}finally{$('ab').disabled=false}};
['au','ap'].forEach(i=>$(i).onkeydown=e=>{if(e.key==='Enter')$('ab').click()});
$('lo').onclick=()=>{TOKEN='';USER='';try{localStorage.removeItem('nobar-token')}catch(e){}show()};
$('go').onclick=()=>{name=ACC?USER:$('name').value.trim();code=$('code').value.trim().toUpperCase();
 if(!name||!code)return toast(ACC?'Isi kode room':'Isi nama dan kode room');
 try{if(!ACC)localStorage.setItem('nobar-name',name)}catch(e){}
 location.hash=code;$('join').style.display='none';$('room').style.display='flex';$('rc').textContent=code;connect()};
['name','code'].forEach(i=>$(i).onkeydown=e=>{if(e.key==='Enter')$('go').click()});
$('leave').onclick=()=>{const b=$('leave');
 if(!lt){b.textContent='Yakin?';b.classList.add('pri');lt=setTimeout(()=>{lt=0;b.textContent='Keluar';b.classList.remove('pri')},3000);return}
 clearTimeout(lt);leaving=true;try{ws.close()}catch(e){}location.replace(location.pathname)};
function connect(){
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>{retry=0;ws.send(JSON.stringify({t:'join',room:code,name,token:TOKEN}))};
 ws.onclose=()=>{if(leaving)return;toast('Terputus, menyambung ulang…');setTimeout(connect,Math.min(1000*++retry,5000))};
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t==='joined'){me=m.id}
  else if(m.t==='members'){const prevHost=host;host=m.host;mode=m.mode;
   $('info').textContent=m.list.length+' orang · '+(mode==='duo'?'berdua, saling setuju':mode==='solo'?'sendiri':'host: '+(m.list.find(x=>x.id===host)||{}).name);
   if(prevHost&&prevHost!==host)sys((m.list.find(x=>x.id===host)||{}).name+' jadi host');ui()}
  else if(m.t==='state'){m.at=Date.now();applyState(m)}
  else if(m.t==='chat')chat(m);
  else if(m.t==='history'){loadingHist=true;sys('Riwayat chat');m.list.forEach(x=>chat({from:x.from,text:x.text,id:x.from===name?me:0}));sys('Baru bergabung');loadingHist=false}
  else if(m.t==='proposal')proposal(m);
  else if(m.t==='kicked'||m.t==='replaced'){leaving=true;toast(m.t==='kicked'?'Kamu dikeluarkan oleh host':'Akun dipakai di perangkat lain');setTimeout(()=>location.replace(location.pathname),1600)}
  else if(m.t==='err')toast(m.msg)};
}
const act=(k,extra)=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(Object.assign({t:'act',k,pos:cur()},extra||{})))};
const canAct=()=>mode!=='host'||host===me;
function ui(){const c=canAct();['pp','seek','url','load'].forEach(i=>$(i).disabled=!c)}
function parse(u){u=u.trim();let m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
 if(m)return{type:'yt',id:m[1],url:u};return /^https?:\/\//i.test(u)?{type:'url',url:u}:null}
$('load').onclick=()=>{const v=parse($('url').value);if(!v)return toast('Link tidak valid');act('load',{video:v});$('url').value=''};
$('pp').onclick=()=>act(playing?'pause':'play');
$('seek').onchange=()=>{dragging=false;act('seek',{pos:$('seek').value/1000*dur()})};
$('seek').oninput=()=>dragging=true;
function cur(){try{return yt?yt.getCurrentTime():el?el.currentTime:0}catch(e){return 0}}
function dur(){try{return(yt?yt.getDuration():el?el.duration:0)||0}catch(e){return 0}}
function loadYT(){if(window.YT&&YT.Player){mountYT();return}
 if(document.getElementById('ytapi'))return;const s=document.createElement('script');s.id='ytapi';s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
 window.onYouTubeIframeAPIReady=()=>{if(vid&&vid.type==='yt')mountYT()}}
function clear(){const s=$('stage');if(yt){try{yt.destroy()}catch(e){}yt=null}if(el){el.pause();el=null}s.innerHTML=''}
function mountYT(){clear();const d=document.createElement('div');d.id='ytp';$('stage').appendChild(d);
 yt=new YT.Player('ytp',{videoId:vid.id,playerVars:{controls:0,disablekb:1,playsinline:1,rel:0,modestbranding:1,fs:0},
  events:{onReady:()=>{if(sync)applyState(sync)},onError:()=>toast('Video tidak bisa diputar')}})}
function mountEl(){clear();el=document.createElement('video');el.playsInline=true;el.setAttribute('playsinline','');el.src=vid.url;
 el.onerror=()=>toast('Video tidak bisa diputar');el.onloadedmetadata=()=>{if(sync)applyState(sync)};$('stage').appendChild(el)}
function ub(){let b=$('unm');if(!b){b=document.createElement('button');b.id='unm';b.textContent='Ketuk untuk menyalakan suara';
 b.onclick=()=>{try{yt?yt.unMute():(el.muted=false)}catch(e){}b.style.display='none'};$('stage').appendChild(b)}return b}
function isPlaying(){try{return yt?[1,3].includes(yt.getPlayerState()):!!el&&!el.paused}catch(e){return false}}
function kick(){if(!sync||!sync.playing||(!yt&&!el))return;
 try{if(isPlaying())return;if(yt){yt.mute();yt.playVideo()}else{el.muted=true;el.play().catch(()=>{})}ub().style.display='block'}catch(e){}}
function expect(s){return s.playing?s.pos+(Date.now()-s.at)/1000:s.pos}
function applyState(s){sync=s;const nv=s.video;if(!nv)return;
 if(!vid||JSON.stringify(vid)!==JSON.stringify(nv)){vid=nv;
  if(vid.type==='yt')loadYT();else mountEl();return}
 playing=s.playing;$('pp').textContent=playing?'❚❚':'▶';
 if(!yt&&!el)return;
 try{const p=expect(s);if(Math.abs(cur()-p)>1.5){yt?yt.seekTo(p,true):(el.currentTime=p)}
  if(playing){yt?yt.playVideo():el.play().catch(kick)}else{yt?yt.pauseVideo():el.pause()}}catch(e){}
 if(playing)setTimeout(kick,2500)}
setInterval(()=>{const d=dur();if(!dragging&&d)$('seek').value=cur()/d*1000;$('tm').textContent=fmt(cur())+(d?' / '+fmt(d):'')},500);
setInterval(()=>{if(host===me&&mode==='host'&&playing&&ws.readyState===1)ws.send(JSON.stringify({t:'tick',pos:cur()}))},4000);
setInterval(()=>{if(sync&&sync.playing&&(yt||el)){kick();try{const p=expect(sync);if(Math.abs(cur()-p)>2.5){yt?yt.seekTo(p,true):(el.currentTime=p)}}catch(e){}}},3000);
function proposal(m){const p=m.p,b=$('prop');if(!p){b.style.display='none';if(m.ok===false)toast('Usulan ditolak');return}
 b.style.display='flex';const mine=p.by===me;$('pt').textContent=mine?'Menunggu persetujuan untuk '+p.label+'…':p.name+' ingin '+p.label;
 $('yes').style.display=$('no').style.display=mine?'none':'inline-block'}
$('yes').onclick=()=>ws.send(JSON.stringify({t:'vote',ok:true}));$('no').onclick=()=>ws.send(JSON.stringify({t:'vote',ok:false}));
function add(c,cls){const d=document.createElement('div');d.className='m '+cls;d.appendChild(c);const l=$('msgs');l.appendChild(d);l.scrollTop=l.scrollHeight;while(l.children.length>200)l.removeChild(l.firstChild)}
function chat(m){const f=document.createDocumentFragment();const s=document.createElement('small');s.textContent=m.from;const t=document.createTextNode(m.text);
 if(m.id!==me)f.appendChild(s);f.appendChild(t);add(f,m.id===me?'me':'')}
function sys(t){add(document.createTextNode(t),'sys')}
const send=()=>{const t=$('msg').value.trim();if(t&&ws.readyState===1){ws.send(JSON.stringify({t:'chat',text:t}));$('msg').value=''}};
$('snd').onclick=send;$('msg').onkeydown=e=>{if(e.key==='Enter')send()};
$('share').onclick=()=>{const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link disalin'),()=>prompt('Salin link:',u))};
</script><script src="rtc.js"></script><script src="extra.js"></script><script src="ios.js"></script><script src="cinema.js"></script><script src="joinreq.js"></script></script></body></html>
