<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Nobar Admin</title>
<style>body{margin:0;padding:16px;font:15px system-ui,sans-serif;background:#0b1020;color:#f4f7ff}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.c{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:12px}
.c b{display:block;font-size:26px}.c span{font-size:12px;color:#b4bedb}input,button{font:inherit;padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.12);font-size:13px}p{color:#b4bedb;font-size:12px}
#tmp{display:none;margin:10px 0;padding:14px;border-radius:18px;background:rgba(127,214,255,.2);border:1px solid rgba(127,214,255,.5)}#tmp code{display:block;font:700 20px ui-monospace,monospace;margin:6px 0;user-select:all;letter-spacing:1px}</style></head><body>
<h2>Nobar Admin</h2><div id="lg"><input id="k" type="password" placeholder="Kunci admin"> <button id="go">Masuk</button></div>
<div id="d" style="display:none"><div class="g" id="g"></div><h3>Room aktif</h3><table><thead><tr><th>Kode</th><th>Orang</th><th>Status</th><th>Video</th><th>Antre</th></tr></thead><tbody id="t"></tbody></table>
<h3>Riwayat (tersimpan)</h3><div class="g" id="h"></div><table><tbody id="hd"></tbody></table>
<h3>Akun terdaftar</h3><input id="q" placeholder="Cari username…" style="width:100%;margin-bottom:8px"><div id="tmp"></div>
<table><thead><tr><th>Username</th><th>Daftar</th><th>Kode</th><th></th></tr></thead><tbody id="ac"></tbody></table>
<p>Password tidak bisa dilihat karena disimpan sebagai hash. Kalau user lupa, tekan Reset lalu kirim password sementara ke user.</p><p id="s"></p></div>
<script>
const $=i=>document.getElementById(i);let key='',tm;
const H=()=>({'x-admin-key':key});
async function load(){try{const r=await fetch('/api/stats',{headers:H()});
 if(r.status===401){clearInterval(tm);$('d').style.display='none';$('lg').style.display='block';return alert('Kunci salah')}
 const s=await r.json();$('lg').style.display='none';$('d').style.display='block';
 const c=[['Online sekarang',s.online],['Room aktif',s.active.length],['Room dibuat',s.rooms],['Masuk (sesi ini)',s.joins],['Puncak online',s.peak],['Terpasang (PWA)',s.installs]];
 $('g').innerHTML=c.map(x=>'<div class="c"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('');
 $('t').innerHTML=s.active.map(a=>'<tr><td>'+a.code+(a.locked?' 🔒':'')+'</td><td>'+a.n+'</td><td>'+(a.playing?'▶':'⏸')+'</td><td>'+a.video+'</td><td>'+a.queue+'</td></tr>').join('')||'<tr><td colspan=5>Tidak ada room aktif</td></tr>';
 $('s').textContent='Angka sesi dihitung sejak '+new Date(s.since).toLocaleString('id-ID')+' (reset tiap deploy). Diperbarui tiap 5 detik.'}catch(e){}}
async function hist(){try{const r=await fetch('/api/history',{headers:H()});if(!r.ok)return;const s=await r.json();
 if(!s.db){$('h').innerHTML='<div class="c"><span>Database belum aktif</span></div>';$('hd').innerHTML='';return}
 const T=s.totals||{};$('h').innerHTML=[['Room (total)',T.room||0],['Masuk (total)',T.join||0],['Daftar akun',T.signup||0],['Terpasang',T.install||0]].map(x=>'<div class="c"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('');
 const D={};(s.days||[]).forEach(x=>{(D[x.day]=D[x.day]||{})[x.kind]=x.n});
 $('hd').innerHTML='<tr><th>Tanggal</th><th>Room</th><th>Masuk</th><th>Daftar</th></tr>'+Object.keys(D).map(d=>'<tr><td>'+d+'</td><td>'+(D[d].room||0)+'</td><td>'+(D[d].join||0)+'</td><td>'+(D[d].signup||0)+'</td></tr>').join('')}catch(e){}}
async function accs(){try{const r=await fetch('/api/admin/accounts?q='+encodeURIComponent($('q').value.trim()),{headers:H()});if(!r.ok)return;const j=await r.json();const b=$('ac');b.innerHTML='';
 if(!j.accounts.length){b.innerHTML='<tr><td colspan=4>Tidak ada akun</td></tr>';return}
 j.accounts.forEach(a=>{const tr=document.createElement('tr'),u=document.createElement('td'),d=document.createElement('td'),k=document.createElement('td'),x=document.createElement('td'),bt=document.createElement('button');
  u.textContent=a.username;d.textContent=new Date(a.created).toLocaleDateString('id-ID');k.textContent=a.rec?'✓':'-';bt.textContent='Reset';bt.style.padding='5px 12px';
  bt.onclick=async()=>{if(!confirm('Reset password '+a.username+'? Password lama tidak berlaku lagi.'))return;
   const r=await fetch('/api/admin/reset',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H()),body:JSON.stringify({username:a.username})});
   const j=await r.json();const t=$('tmp');t.style.display='block';t.textContent='';
   if(!r.ok){t.textContent=j.error||'Gagal';return}
   const m=document.createElement('div');m.textContent='Password sementara untuk '+j.user+':';const c=document.createElement('code');c.textContent=j.temp;const n=document.createElement('div');n.textContent='Kirim ke user. Hanya tampil sekali.';t.append(m,c,n)};
  x.appendChild(bt);tr.append(u,d,k,x);b.appendChild(tr)})}catch(e){}}
let qt;$('q').oninput=()=>{clearTimeout(qt);qt=setTimeout(accs,300)};
$('go').onclick=()=>{key=$('k').value.trim();load();hist();accs();clearInterval(tm);tm=setInterval(()=>{load();hist()},5000)};
</script></body></html>
