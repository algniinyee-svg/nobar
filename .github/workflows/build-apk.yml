name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Cek password keystore
        run: |
          if [ ${#KS_PASS} -lt 8 ]; then
            echo "::error::Secret KEYSTORE_PASSWORD belum diisi atau kurang dari 8 karakter. Isi di Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Pasang Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pasang dependensi
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Buat proyek Android
        working-directory: android-app
        run: npx cap add android

      - name: Patch proyek (izin, ikon, kode native, App Links)
        working-directory: android-app
        run: node scripts/patch.js

      - name: Pasang konfigurasi Firebase
        run: |
          if [ -z "$GSJ" ]; then
            echo "::warning::Secret GOOGLE_SERVICES_JSON belum diisi. Aplikasi tetap jadi, tapi notifikasi saat aplikasi ditutup belum aktif."
          else
            printf '%s' "$GSJ" > android-app/android/app/google-services.json
            node -e "const j=JSON.parse(require('fs').readFileSync('android-app/android/app/google-services.json','utf8'));const ok=(j.client||[]).some(c=>c.client_info&&c.client_info.android_client_info&&c.client_info.android_client_info.package_name==='com.algani.nobar');if(!ok){console.error('::error::google-services.json tidak berisi aplikasi com.algani.nobar. Daftarkan aplikasi Android dengan nama paket tersebut di Firebase.');process.exit(1)}console.log('google-services.json valid untuk proyek',j.project_info&&j.project_info.project_id)"
          fi

      - name: Atur versi
        working-directory: android-app/android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.2.${{ github.run_number }}\"/" build.gradle
          grep -n "versionCode\|versionName" build.gradle

      - name: Sinkronkan
        working-directory: android-app
        run: npx cap sync android

      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Siapkan kunci penandatangan
        run: |
          ENC=android-app/release.keystore.enc
          if [ -f "$ENC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KS_PASS -in "$ENC" -out /tmp/release.jks || { echo "::error::Password keystore tidak cocok dengan yang dipakai saat pertama kali."; exit 1; }
          else
            keytool -genkeypair -noprompt -keystore /tmp/release.jks -storepass "$KS_PASS" -keypass "$KS_PASS" -alias nobar -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nobar, O=Algani Hamid, C=ID"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KS_PASS -in /tmp/release.jks -out "$ENC"
            echo "NEW_KS=1" >> "$GITHUB_ENV"
          fi

      - name: Tanda tangani APK
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          IN=android-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p 4 "$IN" /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/release.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS --out /tmp/nobar.apk /tmp/aligned.apk
          "$BT/apksigner" verify --print-certs /tmp/nobar.apk | head -5
          mkdir -p public
          cp /tmp/nobar.apk public/nobar.apk

      - name: Buat berkas verifikasi tautan aplikasi (assetlinks)
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          FP=$("$BT/apksigner" verify --print-certs /tmp/nobar.apk | grep -m1 'SHA-256 digest' | sed 's/.*: //' | tr 'a-f' 'A-F' | sed 's/../&:/g;s/:$//')
          if [ -z "$FP" ]; then echo "::error::Sidik jari sertifikat tidak terbaca."; exit 1; fi
          echo "Sidik jari: $FP"
          mkdir -p public/.well-known
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.algani.nobar","sha256_cert_fingerprints":["%s"]}}]' "$FP" > public/.well-known/assetlinks.json
          cat public/.well-known/assetlinks.json

      - name: Simpan salinan APK
        uses: actions/upload-artifact@v4
        with:
          name: nobar-apk
          path: /tmp/nobar.apk

      - name: Simpan APK ke repo
        run: |
          git config user.name "nobar-bot"
          git config user.email "nobar-bot@users.noreply.github.com"
          git add -f public/nobar.apk public/.well-known/assetlinks.json
          if [ "$NEW_KS" = "1" ]; then git add -f android-app/release.keystore.enc; fi
          git commit -m "build: APK v1.2.${{ github.run_number }}" || echo "tidak ada perubahan"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
